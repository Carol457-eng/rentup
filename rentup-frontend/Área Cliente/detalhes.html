<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa da Serra - HospedaBem</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>

    <div class="container mt-4">

        <a href="cliente.html" class="btn btn-secondary">
            ← Voltar
        </a>

        <h1 class="mt-3" id="titulo"></h1>

        <p id="cidade"></p>

        <img
    id="imagem"
    class="img-fluid rounded"
    alt="Hospedagem"
>

        <div class="row mt-4">

            <div class="col-md-8">

                <h3>Sobre esta hospedagem</h3>

                <p id="descricao"></p>

                <h3>Comodidades</h3>

                <ul>
                    <li>Wi-Fi</li>
                    <li>Piscina</li>
                    <li>Ar-condicionado</li>
                    <li>Churrasqueira</li>
                    <li>Estacionamento</li>
                </ul>

            </div>

            <div class="col-md-4">

                <div class="card">

                    <div class="card-body">

                        <h2 id="preco"></h2>

                        <p id="hospedes"></p>

                        <a id="btnReserva"
                             class="btn btn-success w-100">
                                Reservar Agora
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/detalhes.js"></script>
</body>
</html>
