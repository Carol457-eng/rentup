<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Imóvel - HospedaBem</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <h1>Cadastrar Imóvel</h1>

    <form>

        <div class="mb-3">
            <label class="form-label">Nome do Imóvel</label>
            <input type="text" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Cidade</label>
            <input type="text" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Preço por Noite</label>
            <input type="number" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Quantidade de Hóspedes</label>
            <input type="number" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">Imagem</label>
            <input type="text" class="form-control"
                   placeholder="imagens/casa4.jpg">
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>

            <textarea
                class="form-control"
                rows="5">
            </textarea>
        </div>

        <button
            type="submit"
            class="btn btn-success">
            Salvar Imóvel
        </button>

    </form>

</div>

</body>
</html>
